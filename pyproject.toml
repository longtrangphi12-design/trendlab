[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendlab"
version = "0.1.0"
description = "Statistical tools "
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "netCDF4",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
